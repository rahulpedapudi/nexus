services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus
    volumes:
      - ${NEXUS_HOME:-~/.nexus}/data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8421}:8421"
    env_file:
      - ${NEXUS_HOME:-~/.nexus}/.env
    environment:
      - DATABASE_URL=postgresql://nexus:${POSTGRES_PASSWORD}@db:5432/nexus
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${NEXUS_HOME:-~/.nexus}/context:/app/context:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8421/health"]
      interval: 10s
      timeout: 5s
      retries: 5
